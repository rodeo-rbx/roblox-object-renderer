[workspace]
resolver = "3"
members = ["crates/ror", "crates/ror-mesh", "crates/ror-image", "crates/ror-assets"]
default-members = ["crates/ror"]

[workspace.package]
version = "0.3.0-rodeo.1"
edition = "2024"
rust-version = "1.90"
license = "GPL-2.0-or-later"
repository = "https://github.com/Anime-Vanguards/roblox-object-renderer"
publish = false

[workspace.dependencies]
ror-mesh = { path = "crates/ror-mesh" }
ror-image = { path = "crates/ror-image" }
ror-assets = { path = "crates/ror-assets" }

anyhow = "1.0.100"
thiserror = "2"
bytemuck = { version = "1.24.0", features = ["derive"] }
glam = { version = "0.30", features = ["bytemuck"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["float_roundtrip"] }
parking_lot = "0.12.5"
rayon = "1.11.0"

# The release profile is the everyday build: full optimisation, incremental, so an edit rebuilds fast.
# lto = false is cargo's ThinLTO across each crate's codegen units, kept for runtime: lto = "off" rebuilt a
# one-line edit in 10-15 s instead of 24 s, but stills drew 10-15% slower (docs/building.md "Building").
[profile.release]
opt-level = 3
lto = false
incremental = true
codegen-units = 256
debug = "line-tables-only"

# Dependencies, rebuilt only when Cargo.lock changes, are one unit each: whole crates inlined without
# ThinLTO, and a clean build is faster (178 -> 141 s)
[profile.release.package."*"]
codegen-units = 1

# Slower whole-program build for distribution and benchmarks
[profile.dist]
inherits = "release"
lto = "thin"
incremental = false
codegen-units = 16
debug = false
strip = true

# Debug builds still optimise dependencies (image decoding, Draco, wgpu validation stay usable)
[profile.dev.package."*"]
opt-level = 2

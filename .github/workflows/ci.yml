# Runs on the public repository only: the private one has no free Actions minutes to spare.
# Third-party actions are pinned to full commit SHAs; Dependabot (private repo) keeps them current.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: ${{ !github.event.repository.private }}
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # macOS too (the fork): its renders go through Metal, and the tests on Windows' memory
        # admission and the capture Studio build on Windows only
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: "1.90.0"
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The public build: no GPU on GitHub's Windows runners, so ror's render tests run on the
      # software adapter (WARP); no Studio install or Roblox client cache, so the tests needing them skip.
      - name: Build
        run: cargo build --release --locked --workspace --all-targets
      - name: Test the decoding and asset crates
        run: cargo test --release --locked -p ror-image -p ror-mesh -p ror-assets
      - name: Test ror
        run: cargo test --release --locked -p ror -- --test-threads=1
      - name: Clippy
        run: cargo clippy --release --locked --workspace --all-targets
